<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaLive · 启动</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #111111;
      --muted: #5f666d;
      --dim: #8c9298;
      --line: #e3e5e7;
      --line-strong: #c9ccd0;
      --panel: #ffffff;
      --panel-2: #f7f8f9;
      --accent: #e60012;
      --accent-dark: #c2000f;
      --accent-soft: #fdecee;
      --ok: #0f9d68;
      --ok-bg: #e9f8f1;
      --warn: #c98a1b;
      --bad: #d9263a;
      --bad-bg: #fdecee;
      --shadow: 0 18px 44px rgba(0,0,0,.08);
      --motion: 240ms cubic-bezier(.2,.7,.2,1);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0d10;
      --ink: #e9edf0;
      --muted: #8b97a1;
      --dim: #5a6670;
      --line: #222c34;
      --line-strong: #35424d;
      --panel: #10151a;
      --panel-2: #141b21;
      --accent: #35c8ea;
      --accent-dark: #5dd0f0;
      --accent-soft: #0f2833;
      --ok: #4cd3a8;
      --ok-bg: #0d211b;
      --warn: #e6b25c;
      --bad: #f05a66;
      --bad-bg: #2a1b1d;
      --shadow: 0 18px 44px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      overflow-x: hidden;
      transition: background-color var(--motion), color var(--motion);
    }
    button { font: inherit; letter-spacing: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg { width: 18px; height: 18px; stroke-width: 1.8; flex: none; }

    .stage {
      width: min(760px, calc(100% - 96px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 0 26px;
      display: flex;
      flex-direction: column;
    }

    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { font-size: 16px; font-weight: 800; letter-spacing: .22em; }
    .brand span { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .mast-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px; padding: 0;
      border: 1px solid var(--line); border-radius: 2px;
      display: grid; place-items: center;
      background: transparent; color: var(--muted);
      transition: border-color var(--motion), color var(--motion), background-color var(--motion), transform var(--motion);
    }
    .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); background: var(--panel-2); }
    .icon-btn:active { transform: translateY(1px); }
    html[data-theme="light"] .icon-moon { display: none; }
    html[data-theme="dark"] .icon-sun { display: none; }
    .icon-btn svg { grid-area: 1 / 1; }

    .hero { margin: auto 0; padding: 64px 0 40px; animation: rise .55s var(--motion) both; }
    .hero h1 { margin: 0; font-size: clamp(44px, 6.5vw, 68px); font-weight: 800; line-height: 1; letter-spacing: .05em; animation: title-in .7s var(--motion) both; }
    .hero p { margin: 14px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .04em; }

    .status-panel {
      border: 1px solid var(--line); border-top: 3px solid var(--accent);
      background: var(--panel);
      animation: rise .55s var(--motion) .08s both;
      transition: background-color var(--motion), border-color var(--motion);
    }
    .status-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
    .status-item {
      min-width: 0; min-height: 86px; padding: 16px 18px;
      border-right: 1px solid var(--line);
      display: grid; grid-template-columns: auto minmax(0,1fr); align-content: center; align-items: center; gap: 4px 10px;
      transition: background-color var(--motion);
    }
    .status-item:last-child { border-right: 0; }
    .status-item:hover { background: var(--panel-2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); grid-row: span 2; }
    .status-item b { font-size: 13px; font-weight: 650; }
    .status-item span { color: var(--muted); font-size: 12px; }
    .status-item .status-value { color: var(--dim); }
    .status-item.is-checking .status-dot { animation: blink .8s ease-in-out infinite; }
    .status-item.is-ok .status-dot { background: var(--ok); }
    .status-item.is-ok .status-value { color: var(--ok); }
    .status-item.is-fail .status-dot { background: var(--bad); }
    .status-item.is-fail .status-value { color: var(--bad); }
    .status-item.is-fail { background: var(--bad-bg); }
    .status-item.is-ok { background: var(--ok-bg); }
    .error { min-height: 18px; margin: 12px 0 0; color: var(--bad); font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
    .error:empty { display: none; }

    .actions {
      margin-top: 18px;
      display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,.8fr); gap: 12px;
      animation: rise .55s var(--motion) .16s both;
    }
    .start-btn, .secondary-btn {
      min-height: 62px; padding: 0 22px;
      border-radius: 2px; font-size: 15px; font-weight: 700; letter-spacing: .12em;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: background-color var(--motion), border-color var(--motion), color var(--motion), transform var(--motion), box-shadow var(--motion);
    }
    .start-btn, .secondary-btn { width: 100%; }
    .start-btn {
      border: 1px solid var(--accent);
      background: var(--accent); color: #ffffff;
    }
    .start-btn:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); box-shadow: 0 8px 22px rgba(230,0,18,.22); transform: translateY(-1px); }
    html[data-theme="dark"] .start-btn:hover:not(:disabled) { box-shadow: 0 8px 22px rgba(53,200,234,.24); }
    .start-btn:active:not(:disabled) { transform: translateY(0); }
    .secondary-btn { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); }
    .secondary-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .btn-spinner {
      width: 15px; height: 15px; flex: none;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #ffffff;
      border-radius: 50%; display: none;
      animation: spin .7s linear infinite;
    }
    .start-btn.is-loading .btn-spinner, .dialog-btn.is-loading .btn-spinner { display: inline-block; }
    .progress-line {
      position: relative; grid-column: 1 / -1; height: 2px; margin-top: 2px;
      overflow: hidden; background: var(--line); border-radius: 2px;
      opacity: 0; transition: opacity var(--motion);
    }
    .progress-line.is-active { opacity: 1; }
    .progress-line::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 34%;
      background: var(--accent); border-radius: 2px;
      animation: progress-sweep 1.1s ease-in-out infinite;
    }

    .footer {
      margin-top: 30px; padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; gap: 12px;
      color: var(--dim); font-size: 11px; letter-spacing: .06em;
      animation: rise .55s var(--motion) .24s both;
    }

    dialog.exit-confirm {
      width: min(440px, calc(100% - 40px)); padding: 0;
      border: 1px solid var(--line-strong); border-top: 3px solid var(--accent);
      border-radius: 2px; background: var(--panel); color: var(--ink);
    }
    dialog.exit-confirm::backdrop { background: rgba(4,6,8,.55); }
    dialog.exit-confirm .dialog-body { padding: 22px 24px 20px; }
    dialog.exit-confirm h2 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    dialog.exit-confirm .dialog-sub { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    dialog.exit-confirm ul { margin: 14px 0; padding: 0; list-style: none; border: 1px solid var(--line); }
    dialog.exit-confirm li { padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
    dialog.exit-confirm li:last-child { border-bottom: 0; }
    dialog.exit-confirm .exit-policy-hint { margin: 0 0 18px; color: var(--dim); font-size: 11px; line-height: 1.6; }
    dialog.exit-confirm .exit-policy-hint b { color: var(--warn); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .dialog-btn {
      min-height: 38px; padding: 0 18px;
      border: 1px solid var(--line-strong); border-radius: 2px;
      background: transparent; color: var(--ink); font-size: 12px; letter-spacing: .08em;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: border-color var(--motion), color var(--motion), background-color var(--motion);
    }
    .dialog-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dialog-btn-danger { border-color: var(--bad); color: var(--bad); }
    .dialog-btn-danger:hover { background: var(--bad-bg); color: var(--bad); }
    dialog.exit-confirm[open] { animation: dialog-in .24s var(--motion) both; }
    dialog.exit-confirm::backdrop { animation: backdrop-in .2s ease-out both; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes title-in { from { opacity: 0; letter-spacing: .2em; transform: translateY(10px); } to { opacity: 1; letter-spacing: .05em; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes progress-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(380%); } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 640px) {
      .stage { width: calc(100% - 40px); padding-top: 22px; }
      .status-row { grid-template-columns: 1fr; }
      .status-item { border-right: 0; border-bottom: 1px solid var(--line); }
      .status-item:last-child { border-bottom: 0; }
      .actions { grid-template-columns: 1fr; }
      .footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
  <script>
    (function () {
      var KEY = "personalive:theme";
      var COOKIE = "personalive_theme";
      function readCookie(name) {
        try {
          var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]*)"));
          return m ? decodeURIComponent(m[1]) : null;
        } catch (e) { return null; }
      }
      function current() {
        var s = null;
        try { s = localStorage.getItem(KEY); } catch (e) {}
        if (s === "dark" || s === "light") return s;
        return readCookie(COOKIE) === "dark" ? "dark" : "light";
      }
      function apply(theme) {
        var next = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem(KEY, next); } catch (e) {}
        try { document.cookie = COOKIE + "=" + encodeURIComponent(next) + "; path=/; max-age=31536000; SameSite=Lax"; } catch (e) {}
        var btn = document.getElementById("theme-toggle");
        if (btn) {
          var title = next === "dark" ? "切换为浅色主题" : "切换为深色主题";
          btn.title = title;
          btn.setAttribute("aria-label", title);
          btn.setAttribute("aria-pressed", String(next === "dark"));
        }
      }
      apply(current());
      document.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("theme-toggle");
        if (btn) btn.addEventListener("click", function () { apply(current() === "dark" ? "light" : "dark"); });
        apply(current());
      });
    })();
  </script>
</head>
<body>
  <main class="stage">
    <header class="masthead">
      <div class="brand"><strong>PERSONALIVE</strong><span>本地启动</span></div>
      <div class="mast-actions">
        <button id="refresh-btn" class="icon-btn" type="button" title="刷新状态" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <h1>PERSONALIVE</h1>
      <p>本地 AI 角色助手 · 一键启动</p>
    </section>

    <section class="status-panel">
      <div class="status-row" id="status-row">
        <div class="status-item" id="docker-item">
          <i class="status-dot"></i>
          <b>Docker</b>
          <span class="status-value" id="docker-value">检查中</span>
        </div>
        <div class="status-item" id="mysql-item">
          <i class="status-dot"></i>
          <b>MySQL</b>
          <span class="status-value" id="mysql-value">检查中</span>
        </div>
        <div class="status-item" id="milvus-item">
          <i class="status-dot"></i>
          <b>Milvus</b>
          <span class="status-value" id="milvus-value">检查中</span>
        </div>
      </div>
    </section>
    <p class="error" id="status-error"></p>

    <section class="actions">
      <button id="start-btn" class="start-btn" type="button"><span class="btn-spinner" aria-hidden="true"></span><span id="start-label">启动并进入</span></button>
      <button id="docker-btn" class="secondary-btn" type="button">Docker 设置</button>
      <div class="progress-line" id="progress-line" aria-hidden="true"></div>
    </section>
    <p class="error" id="start-error"></p>

    <footer class="footer">
      <span id="footer-version">PERSONALIVE</span>
      <span id="footer-info">服务地址 http://127.0.0.1:17000</span>
    </footer>
  </main>

  <dialog id="exit-confirm-dialog" class="exit-confirm">
    <form method="dialog">
      <div class="dialog-body">
        <h2>退出 PersonaLive</h2>
        <p class="dialog-sub">确认后将依次：</p>
        <ul>
          <li>停止 FastAPI 服务（端口 17000）</li>
          <li>停止 ASR / Embedding 后台进程</li>
          <li>关闭窗口并退出程序</li>
        </ul>
        <p class="exit-policy-hint">Docker 容器按「退出时」策略处理：<b id="exit-policy-label">保持运行</b> — <span id="exit-policy-hint">容器继续运行，下次启动最快</span></p>
        <div class="dialog-actions">
          <button id="exit-cancel" class="dialog-btn" type="button">取消</button>
          <button id="exit-confirm" class="dialog-btn dialog-btn-danger" type="button"><span class="btn-spinner" aria-hidden="true"></span><span id="exit-confirm-label">确认退出</span></button>
        </div>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);

    // pywebview 的 JS 桥是在页面加载完成之后才异步注入的，不能在脚本一开始就取，
    // 否则 API 永远是 undefined。这里改为监听 pywebviewready 事件后惰性获取。
    let API = null;
    window.addEventListener("pywebviewready", () => {
      API = window.pywebview?.api ?? null;
      refresh();
    });
    let lastStatus = null;

    const EXIT_POLICY_NAMES = { keep: "保持运行", pause: "暂停", remove: "删除" };
    const EXIT_POLICY_HINTS = {
      keep: "容器继续运行，下次启动最快。",
      pause: "容器停止但保留，下次启动自动恢复。",
      remove: "移除容器，数据卷保留，下次启动需重建。",
    };

    function renderExitPolicy(policy) {
      const label = $("exit-policy-label");
      const hint = $("exit-policy-hint");
      if (label) label.textContent = EXIT_POLICY_NAMES[policy] || "保持运行";
      if (hint) hint.textContent = EXIT_POLICY_HINTS[policy] || EXIT_POLICY_HINTS.keep;
    }

    window.showExitConfirm = function showExitConfirm() {
      if (API?.get_exit_policy) {
        API.get_exit_policy().then((settings) => renderExitPolicy(settings.on_exit)).catch(() => {});
      }
      $("exit-confirm-dialog").showModal();
    };
    $("exit-cancel").addEventListener("click", () => $("exit-confirm-dialog").close());
    $("exit-confirm").addEventListener("click", () => {
      const btn = $("exit-confirm");
      btn.classList.add("is-loading");
      btn.disabled = true;
      const label = $("exit-confirm-label");
      if (label) label.textContent = "正在退出…";
      if (API?.do_exit) API.do_exit();
    });

    function setStatus(itemId, state, value) {
      const item = $(itemId);
      if (!item) return;
      item.classList.toggle("is-ok", state === "ok");
      item.classList.toggle("is-fail", state === "fail");
      item.classList.remove("is-checking");
      const valueNode = item.querySelector(".status-value");
      if (valueNode) valueNode.textContent = value;
    }

    function renderStatus(s) {
      lastStatus = s;
      setStatus("docker-item", s.docker_ready ? "ok" : "fail",
        s.containers_up ? "已就绪"
          : s.docker_ready ? "未启动容器"
          : "未就绪");
      setStatus("mysql-item", s.mysql_up ? "ok" : "fail", s.mysql_up ? "已连接" : "未连接");
      setStatus("milvus-item", s.milvus_up ? "ok" : "fail", s.milvus_up ? "已连接" : "未连接");
      const label = $("start-label");
      if (label) label.textContent = s.service_running ? "进入系统" : "启动并进入";
      if (s.version) $("footer-version").textContent = `PERSONALIVE v${s.version}`;
      if (s.port) $("footer-info").textContent = `服务地址 http://127.0.0.1:${s.port}`;
    }

    function showStatusError(message) {
      const node = $("status-error");
      if (node) node.textContent = message;
    }

    async function refresh() {
      document.querySelectorAll(".status-item").forEach((item) => item.classList.add("is-checking"));
      showStatusError("");
      try {
        if (!API) throw new Error("未检测到桌面端接口（pywebview）。请在桌面版中打开本页。");
        renderStatus(await API.status());
      } catch (reason) {
        showStatusError(String(reason));
      } finally {
        document.querySelectorAll(".status-item").forEach((item) => item.classList.remove("is-checking"));
      }
    }

    function setBusy(busy) {
      $("start-btn").disabled = busy;
      $("docker-btn").disabled = busy;
      $("refresh-btn").disabled = busy;
      $("start-btn").classList.toggle("is-loading", busy);
      const line = $("progress-line");
      if (line) line.classList.toggle("is-active", busy);
    }

    function updateStartLabel() {
      const label = $("start-label");
      if (label) label.textContent = lastStatus?.service_running ? "进入系统" : "启动并进入";
    }

    async function enterSystem() {
      if (lastStatus?.service_running) {
        if (API?.show_main) API.show_main();
        return;
      }
      setBusy(true);
      $("start-label").textContent = "正在启动…";
      $("start-error").textContent = "";
      try {
        const result = await API.start();
        if (result && result.ok) {
          await refresh();
          if (API?.show_main) API.show_main();
        } else {
          $("start-error").textContent = (result && result.error) || "启动失败";
          updateStartLabel();
        }
      } catch (reason) {
        $("start-error").textContent = String(reason);
        updateStartLabel();
      } finally {
        setBusy(false);
      }
    }

    function openDockerSettings() {
      if (API?.show_docker_settings) API.show_docker_settings();
    }

    $("start-btn").addEventListener("click", enterSystem);
    $("docker-btn").addEventListener("click", openDockerSettings);
    $("refresh-btn").addEventListener("click", refresh);

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
