<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YUMENO</title>
  <style>
    /* ============================================================
       YUMENO 启动页 · 暗夜渐晓
       THESIS: 启动是一段从暗到明的过程。整页是一条横贯屏幕的 1px
       细线：线被点亮、数字推进、背景随之由墨色渐白，最后让位给系统。
       OWN-WORLD: 近黑底 + 中央柔光 + 全宽 1px 细线 + 等宽数字，
       无装饰字标；右下角仅保留版本署名。
       STORY: 打开即自检；线生长、数字前进、一行字说明此刻在做什么；
       完成时页面已接近全白，淡出让位给系统。
       FINISH: 克制、黑白、留白；深色起步，随进度向接近全白过渡。
       ============================================================ */
    :root {
      color-scheme: light dark;
      --bg-top: #101014;
      --bg: #0d0d10;
      --bg-bottom: #08080b;
      --ink: #e9e9ec;
      --muted: #9b9ba3;
      --dim: #60606a;
      --track: #26262c;
      --line: #e9e9ec;
      --elapsed: rgba(210, 210, 215, .36);
      --bad: #ff6b6b;
      --halo: 0;
      --halo-r: 18%;
      --motion: 360ms cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse var(--halo-r) 42% at 50% 42%, rgba(255, 255, 255, var(--halo)) 0%, rgba(255, 255, 255, 0) 72%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 48%, var(--bg-bottom) 100%);
      background-attachment: fixed, fixed;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

    .version {
      position: fixed;
      right: 28px;
      bottom: 22px;
      z-index: 1;
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--dim);
    }

    .loader {
      width: 100vw;
      text-align: center;
      transform: translateY(-4vh);
      animation: rise-in 520ms var(--motion) both;
      transition: opacity 420ms var(--motion);
      position: relative;
      z-index: 1;
    }
    body.is-done .loader { opacity: 0; }

    .track {
      position: relative;
      height: 1px;
      background: var(--track);
      overflow: hidden;
    }
    .track-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      transform: scaleX(var(--p, 0));
      transform-origin: left center;
      background: var(--line);
    }
    .track-tip {
      position: absolute;
      left: calc(var(--p, 0) * 100%);
      top: 50%;
      width: 4px;
      height: 4px;
      transform: translate(50%, -50%) rotate(45deg);
      background: var(--line);
    }

    .loadline {
      margin: 26px 0 0;
      font-size: 12px;
      letter-spacing: .28em;
      color: var(--muted);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
    }
    .loadline .label { letter-spacing: .34em; margin-right: 2px; }
    .loadline b {
      font-weight: 300;
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      color: var(--ink);
    }
    .loadline .dots {
      color: var(--dim);
      letter-spacing: .26em;
      animation: dots 1.4s steps(1, end) infinite;
    }
    .loadline.is-done .dots { animation: none; }

    .phase {
      margin: 12px 0 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .04em;
      min-height: 18px;
      line-height: 1.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .phase.is-active { color: var(--ink); }
    .phase.is-fail { color: var(--bad); }
    .phase .elapsed {
      margin-left: 8px;
      font-size: 11px;
      color: var(--elapsed);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }
    .phase .phase-dim { opacity: .5; }
    .phase .retry {
      margin-left: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .phase .retry:hover { color: var(--ink); }

    dialog.exit-confirm {
      width: min(440px, calc(100% - 40px));
      padding: 22px;
      border: 1px solid #e0e0e3;
      border-radius: 10px;
      background: #ffffff;
      color: #1a1a1a;
      box-shadow: 0 18px 50px rgb(0 0 0 / .2), 0 2px 6px rgb(0 0 0 / .12);
    }
    dialog.exit-confirm::backdrop { background: rgba(0, 0, 0, .42); }
    dialog.exit-confirm h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
    dialog.exit-confirm .dialog-sub { margin: 6px 0 0; color: #6f6f76; font-size: 12px; line-height: 1.5; }
    .exit-options { margin: 16px 0 20px; display: grid; gap: 8px; }
    .exit-option {
      position: relative;
      display: grid;
      grid-template-columns: 16px 20px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #e0e0e3;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color var(--motion), background-color var(--motion);
    }
    .exit-option:hover { border-color: #b8b8bd; background: #f7f7f7; }
    .exit-option:has(input:checked) { border-color: #1a1a1a; background: #f3f3f3; }
    .exit-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .exit-radio { width: 15px; height: 15px; border: 1.5px solid #b8b8bd; border-radius: 50%; transition: border-color var(--motion), background var(--motion); }
    .exit-option:has(input:checked) .exit-radio { border-color: #1a1a1a; background: radial-gradient(circle, #1a1a1a 0 4px, transparent 5px); }
    .exit-option svg { width: 18px; height: 18px; color: #9c9ca2; transition: color var(--motion); }
    .exit-option:has(input:checked) svg { color: #1a1a1a; }
    .exit-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .exit-copy b { font-size: 13px; font-weight: 600; color: #1a1a1a; }
    .exit-copy em { font-style: normal; font-size: 12px; color: #6f6f76; line-height: 1.45; }
    .exit-option:has(input[value="pause"]) .exit-copy { padding-right: 52px; }
    .exit-recommend {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      padding: 3px 9px; border: 1px solid #1a1a1a; border-radius: 999px;
      color: #1a1a1a; font-size: 11px; font-weight: 600; line-height: 1;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 16px; border-top: 1px solid #efeff1; }
    .dialog-btn {
      min-height: 38px; padding: 0 18px;
      border: 1px solid #e0e0e3;
      border-radius: 6px;
      background: transparent; color: #1a1a1a;
      font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color var(--motion), background-color var(--motion), color var(--motion);
    }
    .dialog-btn:hover { border-color: #1a1a1a; }
    .dialog-btn-danger { border-color: #d9a5a0; color: #d64545; }
    .dialog-btn-danger:hover { background: #fdf1f0; border-color: #d64545; }
    dialog.exit-confirm[open] { animation: dialog-in .24s var(--motion) both; }
    dialog.exit-confirm::backdrop { animation: backdrop-in .2s ease-out both; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dots {
      0%, 24% { opacity: .25; }
      50% { opacity: 1; }
      76%, 100% { opacity: .25; }
    }
    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="track" id="track" aria-hidden="true">
      <div class="track-fill" id="track-fill"></div>
      <div class="track-tip" id="track-tip"></div>
    </div>
    <p class="loadline" id="loadline"><span class="label">LOADING - </span><b id="percent-text">0</b><span>%</span><span class="dots">......</span></p>
    <p class="phase" id="phase-text">正在准备环境…</p>
  </main>
  <span class="version" id="version-text">YUMENO</span>

  <dialog id="exit-confirm-dialog" class="exit-confirm">
    <form method="dialog">
      <h2>退出 YUMENO？</h2>
      <p class="dialog-sub">选择退出后如何处理服务</p>
      <div class="exit-options">
        <label class="exit-option"><input type="radio" name="exit-policy" value="pause" checked><span class="exit-radio" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg><span class="exit-copy"><b>停止服务</b><em>暂停 Docker，下次启动自动恢复</em></span><em class="exit-recommend">推荐</em></label>
        <label class="exit-option"><input type="radio" name="exit-policy" value="keep"><span class="exit-radio" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg><span class="exit-copy"><b>保持服务</b><em>Docker 保持运行，下次启动最快</em></span></label>
        <label class="exit-option"><input type="radio" name="exit-policy" value="remove"><span class="exit-radio" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg><span class="exit-copy"><b>删除服务</b><em>删除 Docker 容器，数据保留</em></span></label>
      </div>
      <div class="dialog-actions">
        <button id="exit-cancel" class="dialog-btn" type="button">取消</button>
        <button id="exit-confirm" class="dialog-btn dialog-btn-danger" type="button">安全退出</button>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);

    const BASE = "__LAUNCHER_BASE__".startsWith("http") ? "__LAUNCHER_BASE__" : "http://127.0.0.1:17000";
    const PROGRESS_URL = "__LAUNCHER_PROGRESS__".startsWith("http") ? "__LAUNCHER_PROGRESS__" : "";

    let readyDone = false;
    let currentPercent = 0;
    let targetPercent = 0;
    let rafId = 0;
    let lastFrame = 0;
    let isPreview = false;
    const PROGRESS_SPEED = 32;

    const STEP_ORDER = ["docker", "containers", "milvus", "attu", "service"];
    const STEP_WEIGHTS = { docker: 0.15, containers: 0.38, milvus: 0.62, attu: 0.80, service: 0.93 };

    // 兜底默认速度：动画循环内连续以 2%/秒匀速推进（每 0.5s 涨 1%），
    // 保证进度条在任何情况下都不会冻结，且视觉丝滑不跳格；
    // 若服务尚未加载完就已到 99，则停在 99 等待完成。
    const DEFAULT_RATE = 2;   // 兜底默认速度（%/秒）
    const MAX_LEAD = 99;      // 服务完成前兜底前进的展示上限

    // 暗夜渐晓：前段保持深色（启动期反馈靠文字），接近就绪时加速变白
    // el = [r, g, b, a] 用于耗时小字；halo / haloR 控制中央柔光强度与半径
    const THEME = [
      { p: 0,   bgTop: "#101014", bg: "#0d0d10", bgBottom: "#08080b", ink: "#e9e9ec", muted: "#9b9ba3", dim: "#60606a", track: "#26262c", line: "#e9e9ec", bad: "#ff6b6b", el: [210, 210, 215, 0.36], halo: 0,    haloR: 18 },
      { p: 68,  bgTop: "#18181f", bg: "#14141a", bgBottom: "#0e0e12", ink: "#ececef", muted: "#a3a3ab", dim: "#6a6a73", track: "#2b2b32", line: "#ececef", bad: "#ff7a7a", el: [205, 205, 210, 0.36], halo: 0.18, haloR: 30 },
      { p: 78,  bgTop: "#4a4a52", bg: "#3a3a42", bgBottom: "#2a2a30", ink: "#f1f1f3", muted: "#b5b5bb", dim: "#7b7b83", track: "#4a4a52", line: "#f1f1f3", bad: "#e45757", el: [215, 215, 220, 0.40], halo: 0.26, haloR: 46 },
      { p: 86,  bgTop: "#b4b4b9", bg: "#9a9aa1", bgBottom: "#7e7e85", ink: "#f5f5f6", muted: "#cfcfd3", dim: "#9d9da3", track: "#a6a6ac", line: "#1c1c1f", bad: "#d64545", el: [0, 0, 0, 0.40], halo: 0.16, haloR: 62 },
      { p: 92,  bgTop: "#ededee", bg: "#d9d9dc", bgBottom: "#c4c4c8", ink: "#2c2c30", muted: "#6f6f76", dim: "#9c9ca2", track: "#d9d9dc", line: "#1c1c1f", bad: "#d64545", el: [0, 0, 0, 0.38], halo: 0.05, haloR: 72 },
      { p: 100, bgTop: "#ffffff", bg: "#f6f6f7", bgBottom: "#ececee", ink: "#1a1a1a", muted: "#6f6f76", dim: "#9c9ca2", track: "#e0e0e3", line: "#1a1a1a", bad: "#d64545", el: [0, 0, 0, 0.38], halo: 0,    haloR: 76 },
    ];

    function hexRgb(hex) {
      const value = parseInt(hex.slice(1), 16);
      return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    }
    function mix(a, b, t) { return Math.round(a + (b - a) * t); }
    function mixN(a, b, t) { return a + (b - a) * t; }
    function mixHex(h1, h2, t) {
      const a = hexRgb(h1);
      const b = hexRgb(h2);
      return `rgb(${mix(a[0], b[0], t)}, ${mix(a[1], b[1], t)}, ${mix(a[2], b[2], t)})`;
    }

    function themeAt(p) {
      let a = THEME[0];
      let b = THEME[THEME.length - 1];
      let t = 0;
      for (let i = 1; i < THEME.length; i += 1) {
        if (p <= THEME[i].p) {
          a = THEME[i - 1];
          b = THEME[i];
          t = (p - a.p) / (b.p - a.p);
          break;
        }
      }
      const ea = a.el;
      const eb = b.el;
      return {
        bgTop: mixHex(a.bgTop, b.bgTop, t),
        bg: mixHex(a.bg, b.bg, t),
        bgBottom: mixHex(a.bgBottom, b.bgBottom, t),
        ink: mixHex(a.ink, b.ink, t),
        muted: mixHex(a.muted, b.muted, t),
        dim: mixHex(a.dim, b.dim, t),
        track: mixHex(a.track, b.track, t),
        line: mixHex(a.line, b.line, t),
        bad: mixHex(a.bad, b.bad, t),
        elapsed: `rgba(${mix(ea[0], eb[0], t)}, ${mix(ea[1], eb[1], t)}, ${mix(ea[2], eb[2], t)}, ${mixN(ea[3], eb[3], t).toFixed(2)})`,
        halo: mixN(a.halo, b.halo, t),
        haloR: mixN(a.haloR, b.haloR, t),
      };
    }

    function renderPercent(p) {
      const theme = themeAt(p);
      const s = document.documentElement.style;
      s.setProperty("--bg-top", theme.bgTop);
      s.setProperty("--bg", theme.bg);
      s.setProperty("--bg-bottom", theme.bgBottom);
      s.setProperty("--ink", theme.ink);
      s.setProperty("--muted", theme.muted);
      s.setProperty("--dim", theme.dim);
      s.setProperty("--track", theme.track);
      s.setProperty("--line", theme.line);
      s.setProperty("--elapsed", theme.elapsed);
      s.setProperty("--bad", theme.bad);
      s.setProperty("--halo", theme.halo.toFixed(3));
      s.setProperty("--halo-r", `${theme.haloR.toFixed(1)}%`);
      const track = $("track");
      if (track) track.style.setProperty("--p", (p / 100).toFixed(4));
      const pct = $("percent-text");
      if (pct) pct.textContent = `${Math.round(p)}`;
      const loadline = $("loadline");
      if (loadline) loadline.classList.toggle("is-done", p >= 99.5);
    }

    function setTarget(target) {
      // 进度只前进不后退：任何来源都不允许把目标值拉低，避免进度条倒退
      targetPercent = Math.max(targetPercent, Math.max(0, Math.min(100, Number(target) || 0)));
      if (!rafId) {
        lastFrame = performance.now();
        rafId = requestAnimationFrame(tweenPercent);
      }
    }

    function tweenPercent(now) {
      const dt = Math.min(0.1, (now - lastFrame) / 1000);
      lastFrame = now;
      let goal;
      let speed;
      if (isPreview) {
        // 预览模式：仅按目标值渲染，不叠加兜底匀速
        goal = targetPercent;
        speed = PROGRESS_SPEED;
      } else if (targetPercent > currentPercent) {
        // 真实步骤推进：快速追赶目标
        goal = targetPercent;
        speed = PROGRESS_SPEED;
      } else {
        // 兜底：连续匀速前进（2%/秒），封顶 99
        goal = Math.min(MAX_LEAD, currentPercent + DEFAULT_RATE * dt);
        speed = DEFAULT_RATE;
      }
      currentPercent = Math.min(goal, currentPercent + speed * dt);
      const catchingUp = targetPercent > currentPercent;
      const flooring = !isPreview && currentPercent < MAX_LEAD;
      if (catchingUp || flooring) {
        rafId = requestAnimationFrame(tweenPercent);
      } else {
        rafId = 0;
      }
      renderPercent(currentPercent);
    }

    function setPhase(text, state, elapsed) {
      const node = $("phase-text");
      if (!node) return;
      node.replaceChildren();
      if (text) {
        const parts = String(text).split(" · ");
        parts.forEach((part, i) => {
          if (i > 0) node.append(document.createTextNode(" · "));
          if (/^(etcd|MinIO|Milvus|Attu)/i.test(part.trim())) {
            const span = document.createElement("span");
            span.className = "phase-dim";
            span.textContent = part;
            node.append(span);
          } else {
            node.append(document.createTextNode(part));
          }
        });
      }
      if (elapsed != null && Number.isFinite(elapsed) && elapsed >= 5) {
        const span = document.createElement("span");
        span.className = "elapsed";
        span.textContent = `${elapsed}s`;
        node.append(span);
      }
      node.classList.toggle("is-active", state === "running");
      node.classList.toggle("is-fail", state === "fail");
    }

    function addRetry() {
      const node = $("phase-text");
      if (!node || node.querySelector(".retry")) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "retry";
      button.textContent = "重试";
      button.addEventListener("click", () => {
        currentPercent = 0;
        targetPercent = 0;
        node.replaceChildren();
        tick();
      });
      node.append(button);
    }

    async function fetchJson(url, timeoutMs = 2000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function percentFromSteps(steps) {
      let base = 0;
      for (const key of STEP_ORDER) {
        const step = (steps || []).find((s) => s.key === key);
        if (!step) continue;
        const weight = STEP_WEIGHTS[key];
        if (step.state === "ok") base = weight;
        else if (step.state === "running") {
          // 步骤内蠕动：随耗时在 [base, weight] 区间内缓慢推进（上限 90%），
          // 保证长步骤（如等待 Docker/容器健康）期间进度持续前进、不冻结
          const span = weight - base;
          const elapsed = Number.isFinite(step.elapsed) ? step.elapsed : 0;
          const within = Math.min(0.9, 0.04 + elapsed * 0.008);
          return Math.round((base + span * within) * 100);
        }
        else if (step.state === "fail") return Math.round(base * 100);
      }
      return Math.round(base * 100);
    }

    function phaseFromSteps(steps) {
      for (const key of STEP_ORDER) {
        const step = (steps || []).find((s) => s.key === key);
        if (step && step.state === "running") {
          return {
            text: step.detail || "正在启动…",
            state: "running",
            elapsed: Number.isFinite(step.elapsed) ? step.elapsed : null,
          };
        }
        if (step && step.state === "fail") return { text: step.detail || "启动失败", state: "fail" };
      }
      return { text: "正在准备环境…", state: "pending" };
    }

    function handleProgress(p) {
      if (!p || !Array.isArray(p.steps)) return false;
      const stepPercent = percentFromSteps(p.steps);
      const phase = phaseFromSteps(p.steps);
      setPhase(phase.text, phase.state, phase.elapsed);
      if (p.done && p.ok) {
        setTarget(100);
        enterMain();
        return true;
      }
      if (p.done && !p.ok) {
        setPhase(p.error || "启动失败", "fail");
        addRetry();
        return true;
      }
      setTarget(stepPercent);
      return false;
    }

    function enterMain() {
      if (readyDone) return;
      readyDone = true;
      setPhase("服务已就绪", "running");
      const started = performance.now();
      const wait = setInterval(() => {
        if (currentPercent >= 99.5 || performance.now() - started > 1800) {
          clearInterval(wait);
          document.body.classList.add("is-done");
          setTimeout(() => {
            try { window.location.replace(`${BASE}/static/index.html`); } catch (e) { /* ignore */ }
          }, 460);
        }
      }, 100);
    }

    async function tick() {
      if (PROGRESS_URL) {
        try {
          const p = await fetchJson(PROGRESS_URL);
          if (p && Array.isArray(p.steps)) {
            // 进度服务是权威来源：只要它正常返回，就以其为准并结束本轮，
            // 不再去轮询 /api/status，避免两个来源交替覆盖文案、拉扯进度条
            handleProgress(p);
            return;
          }
        } catch (e) { /* 进度服务不可用，回退到主服务状态 */ }
      }
      try {
        const s = await fetchJson(`${BASE}/api/status`);
        if (s && s.app) { enterMain(); return; }
        if (s) {
          const ready = [];
          if (s.sqlite === "ok") ready.push("SQLite");
          if (s.milvus === "ok") ready.push("Milvus");
          setTarget(ready.length ? 45 + ready.length * 20 : 12);
          setPhase(ready.length ? `已连接 ${ready.join("、")}，正在启动本地服务…` : "正在启动本地服务…", "running");
          return;
        }
      } catch (e) { /* 主服务未起 */ }
      setTarget(Math.min(40, targetPercent + 0.6));
      setPhase("正在启动本地服务…", "running");
      if (targetPercent >= 39) {
        setPhase("启动超时，请检查 Docker 状态后重试", "fail");
        addRetry();
      }
    }

    function renderExitPolicy(policy) {
      const radio = document.querySelector('input[name="exit-policy"][value="' + (policy || "pause") + '"]');
      if (radio) radio.checked = true;
    }
    window.showExitConfirm = function showExitConfirm() {
      const api = window.pywebview && window.pywebview.api;
      if (api && api.get_exit_policy) {
        api.get_exit_policy().then((settings) => renderExitPolicy(settings.on_exit)).catch(() => {});
      }
      $("exit-confirm-dialog").showModal();
    };
    $("exit-cancel").addEventListener("click", () => $("exit-confirm-dialog").close());
    $("exit-confirm").addEventListener("click", async () => {
      const btn = $("exit-confirm");
      btn.disabled = true;
      const selected = (document.querySelector('input[name="exit-policy"]:checked') || {}).value || "pause";
      const api = window.pywebview && window.pywebview.api;
      if (api && api.set_exit_policy) {
        try { await api.set_exit_policy(selected); } catch (e) {}
      }
      if (api && api.do_exit) api.do_exit();
      else $("exit-confirm-dialog").close();
    });

    // 预览模式：file://.../onboarding.html#preview=NN 直接渲染到 NN%，便于设计验证
    const previewMatch = (location.hash.match(/preview=([\d.]+)/) || [])[1];
    if (previewMatch !== undefined) {
      isPreview = true;
      renderPercent(Number(previewMatch));
      setTarget(Number(previewMatch));
    } else {
      setInterval(tick, 900);
      tick();
    }
  </script>
</body>
</html>
