<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaLive · 启动</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #161616;
      --ink-soft: #3a3a3a;
      --muted: #717171;
      --dim: #a7a7a7;
      --line: #e4e4e4;
      --ok: #0f9d68;
      --bad: #d9263a;
      --bad-bg: #f8ecea;
      --motion: 220ms cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; letter-spacing: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .topbar {
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      color: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }
    .version { color: var(--dim); font-size: 12px; }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      min-height: 0;
    }
    .launcher {
      position: relative;
      width: min(560px, 100%);
      padding: 58px 44px 48px;
      border: 1px solid var(--line);
      text-align: center;
    }
    .launcher::before, .launcher::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      pointer-events: none;
    }
    .launcher::before { top: -1px; left: -1px; border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); }
    .launcher::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--ink); border-right: 2px solid var(--ink); }

    .start-btn {
      position: relative;
      min-height: 58px;
      width: min(320px, 100%);
      padding: 0 40px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 24px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background-color var(--motion), color var(--motion), border-color var(--motion), transform var(--motion);
    }
    .start-btn::before, .start-btn::after {
      content: "";
      position: absolute;
      width: 9px; height: 9px;
      transition: border-color var(--motion);
    }
    .start-btn::before { top: -1px; left: -1px; border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); }
    .start-btn::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--ink); border-right: 2px solid var(--ink); }
    .start-btn:hover:not(:disabled) { background: var(--ink); color: #ffffff; border-color: var(--ink); }
    .start-btn:hover:not(:disabled)::before, .start-btn:hover:not(:disabled)::after { border-color: #ffffff; }
    .start-btn:active:not(:disabled) { transform: translateY(1px); }
    .btn-spinner {
      width: 16px; height: 16px; flex: none;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; display: none;
      animation: spin .7s linear infinite;
    }
    .start-btn.is-loading .btn-spinner { display: inline-block; }

    .error { min-height: 18px; margin: 16px 0 0; color: var(--bad); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .error:empty { display: none; }

    .steps {
      margin: 34px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      text-align: left;
    }
    .steps li {
      min-height: 42px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 16px 92px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 15px;
      border-bottom: 1px solid var(--line);
    }
    .steps li:last-child { border-bottom: 0; }
    .steps .dot { width: 8px; height: 8px; transform: rotate(45deg); background: var(--dim); transition: background-color var(--motion); }
    .steps .name { color: var(--ink-soft); font-weight: 600; }
    .steps .detail { margin: 0; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .steps li.is-running .dot { background: var(--ink); animation: blink .8s ease-in-out infinite; }
    .steps li.is-running .detail { color: var(--ink); }
    .steps li.is-ok .dot { background: var(--ok); }
    .steps li.is-ok .detail { color: var(--ok); }
    .steps li.is-fail { background: var(--bad-bg); }
    .steps li.is-fail .dot { background: var(--bad); }
    .steps li.is-fail .detail { color: var(--bad); }
    .elapsed { min-height: 18px; margin: 14px 0 0; color: var(--dim); font-size: 12px; }

    .footer {
      height: 40px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--dim);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    dialog.exit-confirm {
      width: min(440px, calc(100% - 40px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
    }
    dialog.exit-confirm::backdrop { background: rgba(20,20,20,.45); }
    dialog.exit-confirm .dialog-body { padding: 22px 24px 20px; }
    dialog.exit-confirm h2 { margin: 0; font-size: 16px; }
    dialog.exit-confirm .dialog-sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    dialog.exit-confirm ul { margin: 14px 0; padding: 0; list-style: none; border: 1px solid var(--line); }
    dialog.exit-confirm li { padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 15px; line-height: 1.6; }
    dialog.exit-confirm li:last-child { border-bottom: 0; }
    dialog.exit-confirm .exit-policy-title { margin: 14px 0 8px; color: var(--ink-soft); font-size: 15px; font-weight: 600; }
    dialog.exit-confirm .exit-option { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; transition: border-color var(--motion), background-color var(--motion); }
    dialog.exit-confirm .exit-option + .exit-option { margin-top: 6px; }
    dialog.exit-confirm .exit-option:hover { border-color: var(--dim); background: #f7f7f7; }
    dialog.exit-confirm .exit-option:has(input:checked) { border-color: var(--ink); background: #f4f4f4; }
    dialog.exit-confirm .exit-option input { width: 16px; height: 16px; min-height: 0; margin: 0; flex: none; accent-color: var(--ink); }
    dialog.exit-confirm .exit-option span { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    dialog.exit-confirm .exit-option b { font-size: 15px; font-weight: 600; color: var(--ink); }
    dialog.exit-confirm .exit-option em { font-style: normal; font-size: 12px; color: var(--dim); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .dialog-btn {
      min-height: 38px; padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent; color: var(--ink);
      font-size: 15px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: border-color var(--motion), color var(--motion), background-color var(--motion);
    }
    .dialog-btn:hover { border-color: var(--ink); color: var(--ink); }
    .dialog-btn-danger { border-color: var(--bad); color: var(--bad); }
    .dialog-btn-danger:hover { background: var(--bad-bg); color: var(--bad); }
    .dialog-btn .btn-spinner { border-color: rgba(0,0,0,.25); border-top-color: var(--ink); }
    dialog.exit-confirm[open] { animation: dialog-in .22s var(--motion) both; }
    dialog.exit-confirm::backdrop { animation: backdrop-in .18s ease-out both; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">PersonaLive</span>
    <span class="version" id="version-text"></span>
  </header>

  <main class="center">
    <section class="launcher">
      <button id="start-btn" class="start-btn" type="button">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span id="start-label">启动</span>
      </button>
      <p class="error" id="start-error"></p>
      <ol class="steps" id="steps">
        <li data-step="docker"><i class="dot"></i><span class="name">Docker</span><em class="detail">等待中</em></li>
        <li data-step="containers"><i class="dot"></i><span class="name">容器</span><em class="detail">等待中</em></li>
        <li data-step="mysql"><i class="dot"></i><span class="name">MySQL</span><em class="detail">等待中</em></li>
        <li data-step="milvus"><i class="dot"></i><span class="name">Milvus</span><em class="detail">等待中</em></li>
        <li data-step="service"><i class="dot"></i><span class="name">本地服务</span><em class="detail">等待中</em></li>
      </ol>
      <p class="elapsed" id="elapsed"></p>
    </section>
  </main>

  <footer class="footer">
    <span id="service-info">服务地址 http://127.0.0.1:17000</span>
    <span>本地启动</span>
  </footer>

  <dialog id="exit-confirm-dialog" class="exit-confirm">
    <form method="dialog">
      <div class="dialog-body">
        <h2>退出 PersonaLive</h2>
        <p class="dialog-sub">确认后将依次：</p>
        <ul>
          <li>停止 FastAPI 服务（端口 17000）</li>
          <li>停止 ASR / Embedding 后台进程</li>
          <li>关闭窗口并退出程序</li>
        </ul>
        <p class="exit-policy-title">Docker 容器处理方式</p>
        <label class="exit-option"><input type="radio" name="exit-policy" value="keep"><span><b>保持运行</b><em>下次启动最快</em></span></label>
        <label class="exit-option"><input type="radio" name="exit-policy" value="pause" checked><span><b>停止（推荐）</b><em>下次启动自动恢复</em></span></label>
        <label class="exit-option"><input type="radio" name="exit-policy" value="remove"><span><b>完全清除</b><em>数据保留，下次启动需重建</em></span></label>
        <div class="dialog-actions">
          <button id="exit-cancel" class="dialog-btn" type="button">取消</button>
          <button id="exit-confirm" class="dialog-btn dialog-btn-danger" type="button"><span class="btn-spinner" aria-hidden="true"></span><span id="exit-confirm-label">确认退出</span></button>
        </div>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);

    let API = null;
    window.addEventListener("pywebviewready", () => {
      API = window.pywebview?.api ?? null;
      refreshStatus();
    });

    const STEP_KEYS = ["docker", "containers", "mysql", "milvus", "service"];

    function renderSteps(steps) {
      STEP_KEYS.forEach((key) => {
        const item = document.querySelector(`[data-step="${key}"]`);
        if (!item) return;
        const info = (steps || []).find((step) => step.key === key) || {};
        item.classList.toggle("is-running", info.state === "running");
        item.classList.toggle("is-ok", info.state === "ok");
        item.classList.toggle("is-fail", info.state === "fail");
        const detail = item.querySelector(".detail");
        if (detail && info.detail) detail.textContent = info.detail;
      });
    }

    function deriveFromStatus(s) {
      renderSteps([
        { key: "docker", state: s.docker_ready ? "ok" : "pending", detail: s.docker_ready ? "Docker Engine 就绪" : "等待中" },
        { key: "containers", state: s.containers_up ? "ok" : "pending", detail: s.containers_up ? "容器已运行" : "等待中" },
        { key: "mysql", state: s.mysql_up ? "ok" : "pending", detail: s.mysql_up ? "MySQL 已连接" : "等待中" },
        { key: "milvus", state: s.milvus_up ? "ok" : "pending", detail: s.milvus_up ? "Milvus 已连接" : "等待中" },
        { key: "service", state: s.service_running ? "ok" : "pending", detail: s.service_running ? "服务已就绪" : "等待中" },
      ]);
    }

    async function refreshStatus() {
      try {
        if (!API) return;
        const s = await API.status();
        if (s.port) $("service-info").textContent = `服务地址 http://127.0.0.1:${s.port}`;
        if (s.version) $("version-text").textContent = `v${s.version}`;
        if (!startPollTimer) deriveFromStatus(s);
      } catch (e) { /* ignore */ }
    }

    function setBusy(busy) {
      $("start-btn").disabled = busy;
      $("start-btn").classList.toggle("is-loading", busy);
      $("start-label").textContent = busy ? "正在启动…" : "启动";
    }

    let startPollTimer = null;
    let startElapsedTimer = null;
    let startStartedAt = 0;

    function clearStartPoll() {
      if (startPollTimer) { clearInterval(startPollTimer); startPollTimer = null; }
      if (startElapsedTimer) { clearInterval(startElapsedTimer); startElapsedTimer = null; }
      $("elapsed").textContent = "";
    }

    function tickElapsed() {
      if (startStartedAt) $("elapsed").textContent = `已耗时 ${Math.floor((Date.now() - startStartedAt) / 1000)} 秒`;
    }

    async function waitForMainReady(attempts = 30) {
      for (let i = 0; i < attempts; i += 1) {
        try {
          const s = await API.status();
          if (s && s.service_running) return true;
        } catch (e) { /* keep waiting */ }
        await new Promise((resolve) => setTimeout(resolve, 500));
      }
      return false;
    }

    async function pollStartProgress() {
      try {
        const p = await API.progress();
        renderSteps(p.steps);
        if (!p.done) return;
        clearStartPoll();
        setBusy(false);
        if (p.ok) {
          if (await waitForMainReady()) {
            if (API?.show_main) API.show_main();
          } else {
            $("start-error").textContent = "服务已启动但尚未就绪，请稍候重试";
          }
        } else {
          $("start-error").textContent = p.error || "启动失败";
        }
      } catch (reason) {
        clearStartPoll();
        setBusy(false);
        $("start-error").textContent = String(reason);
      }
    }

    async function enterSystem() {
      if (startPollTimer) return;
      setBusy(true);
      $("start-error").textContent = "";
      try {
        const result = await API.start();
        if (!result || !result.ok) {
          setBusy(false);
          $("start-error").textContent = (result && result.error) || "启动失败";
          return;
        }
        startStartedAt = Date.now();
        tickElapsed();
        startElapsedTimer = setInterval(tickElapsed, 1000);
        await pollStartProgress();
        startPollTimer = setInterval(pollStartProgress, 600);
      } catch (reason) {
        clearStartPoll();
        setBusy(false);
        $("start-error").textContent = String(reason);
      }
    }

    $("start-btn").addEventListener("click", enterSystem);
    refreshStatus();
    setInterval(refreshStatus, 3000);

    function renderExitPolicy(policy) {
      const radio = document.querySelector('input[name="exit-policy"][value="' + (policy || "pause") + '"]');
      if (radio) radio.checked = true;
    }
    window.showExitConfirm = function showExitConfirm() {
      if (API?.get_exit_policy) {
        API.get_exit_policy().then((settings) => renderExitPolicy(settings.on_exit)).catch(() => {});
      }
      $("exit-confirm-dialog").showModal();
    };
    $("exit-cancel").addEventListener("click", () => $("exit-confirm-dialog").close());
    $("exit-confirm").addEventListener("click", async () => {
      const btn = $("exit-confirm");
      btn.classList.add("is-loading");
      btn.disabled = true;
      $("exit-confirm-label").textContent = "正在退出…";
      const selected = (document.querySelector('input[name="exit-policy"]:checked') || {}).value || "pause";
      if (API?.set_exit_policy) {
        try { await API.set_exit_policy(selected); } catch (e) {}
      }
      if (API?.do_exit) API.do_exit();
    });
  </script>
</body>
</html>
