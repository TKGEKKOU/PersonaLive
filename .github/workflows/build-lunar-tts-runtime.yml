name: Build Lunar TTS runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "third_party/lunar_tts/**"
      - ".github/workflows/build-lunar-tts-runtime.yml"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-headers

      - name: Build TTS engine and service
        shell: msys2 {0}
        run: |
          cmake -S third_party/lunar_tts/cpp/ggml -B third_party/lunar_tts/cpp/ggml/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_STATIC=ON -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DGGML_VULKAN=ON -DGGML_CUDA=OFF
          cmake --build third_party/lunar_tts/cpp/ggml/build --parallel
          cmake -S third_party/lunar_tts/cpp -B third_party/lunar_tts/cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build third_party/lunar_tts/cpp/build --target qwen3tts_shared --parallel
          cd third_party/lunar_tts
          go build -o Qwen3_TTS_Lunar.exe .
          mkdir -p ../../runtime-artifact
          cp Qwen3_TTS_Lunar.exe ../../runtime-artifact/
          cp "$(find cpp/build -name qwen3tts.dll -print -quit)" ../../runtime-artifact/
          cp LICENSE ../../runtime-artifact/LICENSE-Lunar-Astral-Agents.txt
          cp /ucrt64/bin/libgcc_s_seh-1.dll ../../runtime-artifact/
          cp /ucrt64/bin/libgomp-1.dll ../../runtime-artifact/
          cp /ucrt64/bin/libstdc++-6.dll ../../runtime-artifact/
          cp /ucrt64/bin/libwinpthread-1.dll ../../runtime-artifact/
          cp /ucrt64/bin/libvulkan-1.dll ../../runtime-artifact/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: personalive-lunar-tts-runtime-windows-x64-direct
          path: runtime-artifact
          if-no-files-found: error

      - name: Commit bundled runtime
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          test -d runtime-artifact
          test -d runtime/tts
          cp runtime-artifact/* runtime/tts/
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/tts
          git diff --cached --quiet || git commit -m "build: update Vulkan TTS runtime"
          git push origin HEAD:main
