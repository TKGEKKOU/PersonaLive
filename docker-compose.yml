name: yumeno

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: yumeno-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./milvus_data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: yumeno-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /minio_data --console-address ":9001"
    volumes:
      - ./milvus_data/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  standalone:
    image: milvusdb/milvus:v2.5.6
    container_name: yumeno-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    ports:
      - "127.0.0.1:17002:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - ./milvus_data/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  attu:
    image: zilliz/attu:v2.6.5
    container_name: yumeno-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "127.0.0.1:17003:3000"
    depends_on:
      standalone:
        condition: service_healthy
