<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YUMENO</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/js/theme.js"></script>
  <script src="/static/vendor/lucide.min.js" defer></script>
  <script src="/static/js/voice-stream.js" defer></script>
  <script src="/static/js/chat.js" defer></script>
  <script src="/static/js/personas.js" defer></script>
  <script src="/static/js/settings.js" defer></script>
  <script src="/static/js/integrations.js" defer></script>
  <script src="/static/js/plugins.js" defer></script>
  <script src="/static/live2d/vts.js" defer></script>
  <script src="/static/live2d/live2d-panel.js" defer></script>
  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
  <aside class="site-sidebar">
    <div class="sidebar-inner">
      <nav class="primary-nav" aria-label="主导航">
        <button id="nav-chat" class="nav-item" type="button" data-view="chat" title="对话"><i data-lucide="message-circle"></i><span>对话</span></button>
        <button id="nav-create" class="nav-item" type="button" data-view="create" title="新建角色"><i data-lucide="user-plus"></i><span>新建</span></button>
        <button id="nav-manage" class="nav-item" type="button" data-view="manage" title="角色管理"><i data-lucide="library"></i><span>管理</span></button>
        <button id="nav-integrations" class="nav-item" type="button" data-view="integrations" title="接入"><i data-lucide="plug"></i><span>接入</span></button>
        <button id="nav-plugins" class="nav-item" type="button" data-view="plugins" title="技能与工具"><i data-lucide="puzzle"></i><span>技能与工具</span></button>
        <button id="nav-test" class="nav-item" type="button" data-view="test" title="RAG 测试"><i data-lucide="flask-conical"></i><span>测试</span></button>
        <button id="nav-settings" class="nav-item" type="button" data-view="settings" title="设置"><i data-lucide="settings-2"></i><span>设置</span></button>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="sidebar-toggle" type="button" aria-pressed="false" title="切换主题" aria-label="切换主题"><i class="theme-icon-sun" data-lucide="sun"></i><i class="theme-icon-moon" data-lucide="moon"></i></button>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="固定展开侧边栏" aria-pressed="false" title="固定展开侧边栏"><i class="sidebar-collapse-icon" data-lucide="panel-left-close"></i><i class="sidebar-expand-icon" data-lucide="panel-left-open"></i></button>
      </div>
    </div>
  </aside>

  <main class="page-shell">
    <div id="view-root"></div>
  </main>
  </div>

  <div id="preview-backdrop" class="backdrop"></div><aside id="preview-drawer" class="preview-drawer" aria-hidden="true"><header class="drawer-header"><strong id="preview-title">资料预览</strong><button id="close-preview" class="close-button" type="button"><i data-lucide="x"></i></button></header><pre id="preview-content" class="selectable"></pre></aside>
  <dialog id="settings-confirm-dialog" class="settings-confirm-dialog" aria-labelledby="settings-confirm-title"><form method="dialog"><h2 id="settings-confirm-title">保存前确认</h2><p id="settings-confirm-detail" class="settings-confirm-detail"></p><div class="settings-confirm-actions"><button id="settings-confirm-cancel" class="button button-secondary" type="button">取消</button><button id="settings-confirm-submit" class="button button-primary" type="button">确认保存</button></div></form></dialog>
  <dialog id="exit-confirm-dialog" class="settings-confirm-dialog" aria-labelledby="exit-confirm-title"><form method="dialog"><h2 id="exit-confirm-title">退出 YUMENO？</h2><div id="exit-confirm-detail" class="exit-confirm-detail"><p>确认后将依次：</p><ul><li>停止 FastAPI 服务（端口 17000）</li><li>停止 ASR / Embedding 后台进程</li><li>关闭窗口并退出程序</li></ul><p class="exit-policy-title">Docker 容器处理方式</p><label class="exit-option"><input type="radio" name="exit-policy" value="keep"><span><b>保持运行</b><em>下次启动最快</em></span></label><label class="exit-option"><input type="radio" name="exit-policy" value="pause" checked><span><b>停止（推荐）</b><em>下次启动自动恢复</em></span></label><label class="exit-option"><input type="radio" name="exit-policy" value="remove"><span><b>完全清除</b><em>数据保留，下次启动需重建</em></span></label></div><div class="settings-confirm-actions"><button id="exit-confirm-cancel" class="button button-secondary" type="button">取消</button><button id="exit-confirm-submit" class="button button-danger" type="button"><span class="btn-spinner"></span><span id="exit-confirm-label">确认退出</span></button></div></form></dialog>
  <dialog id="delete-persona-dialog" class="settings-confirm-dialog" aria-labelledby="delete-persona-title"><form method="dialog"><h2 id="delete-persona-title">永久删除角色</h2><p id="delete-persona-detail" class="settings-confirm-detail">角色及其所有数据将永久删除，无法恢复。</p><p id="delete-persona-error" class="inline-error" role="alert"></p><div class="settings-confirm-actions"><button id="delete-persona-cancel" class="button button-secondary" type="button">取消</button><button id="delete-persona-confirm" class="button button-danger" type="button">永久删除</button></div></form></dialog>
  <dialog id="save-all-dialog" class="settings-confirm-dialog" aria-labelledby="save-all-title"><h2 id="save-all-title">保存全部修改</h2><p id="save-all-detail" class="settings-confirm-detail"></p><p id="save-all-error" class="inline-error" role="alert"></p><div class="settings-confirm-actions"><button id="save-all-cancel" class="button button-secondary" type="button">取消</button><button id="save-all-confirm" class="button button-primary" type="button">确认保存</button></div></dialog>
</body>
</html>
