    <section id="chat-view" class="view is-hidden">
      <div id="chat-layout" class="chat-layout">
        <section class="chat-panel">
          <div class="chat-toolbar"><button id="live2d-toggle" class="icon-button" type="button" title="角色面板" aria-label="角色面板" aria-pressed="false"><i data-lucide="scan-face"></i></button><div class="chat-persona-picker"><button id="chat-persona-toggle" class="chat-persona-trigger" type="button" aria-haspopup="menu" aria-expanded="false"><strong id="chat-title">选择角色</strong><i data-lucide="chevron-down"></i></button><div id="chat-persona-menu" class="persona-menu is-hidden" role="menu"><div id="persona-list" class="persona-list"></div></div></div><div class="chat-settings"><button id="chat-settings-toggle" class="icon-button" type="button" title="对话设置" aria-label="对话设置" aria-haspopup="menu" aria-expanded="false"><i data-lucide="settings-2"></i></button><div id="chat-settings-menu" class="chat-settings-menu is-hidden" role="menu"><label class="chat-voice-toggle"><input id="assistant-voice-toggle" type="checkbox" checked><span>自动播放语音</span></label><button id="clear-conversation" class="chat-settings-item" type="button" title="清空当前对话" aria-label="清空当前对话" disabled><i data-lucide="trash-2"></i><span>清除聊天记录</span></button></div></div></div>
          <section id="live2d-dock" class="live2d-stage-pane" aria-label="角色舞台" hidden>
            <div id="live2d-stage" class="live2d-stage">
              <canvas id="live2d-canvas" class="live2d-canvas"></canvas>
              <div id="live2d-resize" class="live2d-resize" title="拖动调整舞台高度" aria-label="拖动调整舞台高度"></div>
              <button id="live2d-focus-hint" class="live2d-focus-hint is-hidden" type="button">已进入专注模式 · 点击退出</button>
            </div>
            <footer class="live2d-foot">
              <p id="live2d-status" class="live2d-status" data-state="idle" aria-live="polite"><span class="live2d-led"></span><em id="live2d-status-text">空闲</em></p>
              <div class="live2d-controls">
                <button id="live2d-more" class="icon-button live2d-icon-btn" type="button" title="更多选项" aria-label="更多选项" aria-haspopup="menu" aria-expanded="false"><i data-lucide="more-horizontal"></i></button>
                <div id="live2d-more-menu" class="live2d-more-menu is-hidden" role="menu">
                  <select id="live2d-model" class="live2d-select" title="选择模型" aria-label="选择模型" hidden></select>
                  <button id="live2d-flip" class="live2d-menu-item" type="button" role="menuitem"><i data-lucide="flip-horizontal-2"></i><span>镜像</span></button>
                  <button id="live2d-mode" class="live2d-menu-item" type="button" role="menuitem"><i data-lucide="monitor"></i><span>渲染方式</span></button>
                </div>
              </div>
            </footer>
          </section>

        </section>
      </div>
    </section>
